name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bootstrap pnpm
        run: ./scripts/setup-pnpm.sh
      - name: Verify pnpm
        run: pnpm -v
